services:
  api:
    build: .
    container_name: tails-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tails:tails@postgres:5432/tails
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENTS_TOPIC: tails.events
      KAFKA_CONSUMER_GROUP: tails-api
      JWT_SECRET_KEY: super-secret-change-me
      GOOGLE_CLIENT_ID: stub-google-client-id
      GOOGLE_CLIENT_SECRET: stub-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
    depends_on:
      - postgres
      - zookeeper
      - kafka

  postgres:
    image: postgres:16
    container_name: tails-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tails
      POSTGRES_PASSWORD: tails
      POSTGRES_DB: tails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: tails-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tails-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  postgres_data:
